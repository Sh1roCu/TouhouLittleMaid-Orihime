plugins {
    id 'idea'
    id 'net.fabricmc.fabric-loom' version '1.16-SNAPSHOT'
    id 'maven-publish'
    id 'com.gradleup.shadow' version '9.4.1'
}

version = project.mod_version
group = project.maven_group

base {
    archivesName = "${archives_base_name}"
}


fabricApi {
    configureDataGeneration {
        client = true
    }
}

loom {
    accessWidenerPath = file("src/main/resources/touhou_little_maid.classtweaker")
    mixin {
        defaultRefmapName = "touhou_little_maid.refmap.json"
    }
    runs {
        datagen {
            property "fabric-api.datagen.modid", "touhou_little_maid"
        }
    }
}

