shadowJar {
    configurations = [project.configurations.mcLib]

    dependencies {
        exclude(dependency('junit:junit'))
    }

    archiveClassifier.set("shadow")

    enableAutoRelocation = true
    relocationPrefix = "com.github.tartaricacid.touhoulittlemaid.libs"

    exclude 'META-INF/maven/**/*'
    exclude 'META-INF/versions/**/*'
    exclude 'META-INF/LICENSE'
    exclude '.cache/**'

    mergeServiceFiles()
    minimize()
}

assemble {
    dependsOn shadowJar
}

tasks.compileJava {
    // dsx137: 强制重新编译和生成 refmap.json 文件，避免偶发情况下该文件丢失问题
    outputs.upToDateWhen { false }
}

processResources {
    duplicatesStrategy = DuplicatesStrategy.EXCLUDE
    inputs.property "version", project.version
    inputs.property "minecraft_version", project.minecraft_version
    inputs.property "loader_version", project.loader_version
    filteringCharset "UTF-8"

    filesMatching("fabric.mod.json") {
        expand "version": project.version,
                "minecraft_version": project.minecraft_version,
                "loader_version": project.loader_version
    }
}

def targetJavaVersion = 25
tasks.withType(JavaCompile).configureEach {
    it.options.release = 25
}

tasks.withType(Jar).configureEach {
    duplicatesStrategy = DuplicatesStrategy.WARN
}
tasks.withType(Zip).configureEach {
    duplicatesStrategy = DuplicatesStrategy.WARN
}
tasks.withType(Copy).configureEach {
    duplicatesStrategy = DuplicatesStrategy.WARN
}

java {
    withSourcesJar()

    sourceCompatibility = JavaVersion.VERSION_25
    targetCompatibility = JavaVersion.VERSION_25
}

jar {
    from("LICENSE-MIT") {
        rename { "${it}_${project.archives_base_name}" }
    }
    from("LICENSE-CC") {
        rename { "${it}_${project.archives_base_name}" }
    }
}

idea {
    module {
        downloadSources = true
    }
}

publishing {
    publications {
        create("mavenJava", MavenPublication) {
            artifactId = "${project.archives_base_name}"
            from components.java
        }
    }

    repositories {
        maven {
            url "file:///D:/github_maven/Sh1roCu_MCRepo/repository"
        }
    }
}
